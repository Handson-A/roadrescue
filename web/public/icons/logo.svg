<?xml version="1.0" encoding="UTF-8"?>
<!-- RoadRescue Logo - Represents a rescue vehicle with assistance symbol -->
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Rescue vehicle (simplified truck) -->
  <g transform="translate(50, 80)">
    <!-- Truck body -->
    <rect x="0" y="20" width="60" height="30" fill="#FF4444" rx="3"/>
    <!-- Cabin -->
    <rect x="50" y="10" width="20" height="25" fill="#FF6B6B" rx="2"/>
    <!-- Windows -->
    <rect x="52" y="12" width="8" height="8" fill="#87CEEB"/>
    <rect x="52" y="22" width="8" height="8" fill="#87CEEB"/>
    <!-- Wheels -->
    <circle cx="15" cy="55" r="8" fill="#333"/>
    <circle cx="45" cy="55" r="8" fill="#333"/>
    <!-- Wheel centers -->
    <circle cx="15" cy="55" r="3" fill="#666"/>
    <circle cx="45" cy="55" r="3" fill="#666"/>
  </g>
  
  <!-- Assistance cross in center -->
  <g transform="translate(100, 100)">
    <g fill="#FF4444">
      <rect x="-5" y="-20" width="10" height="40" rx="2"/>
      <rect x="-20" y="-5" width="40" height="10" rx="2"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-size="16" font-weight="bold" text-anchor="middle" fill="#FF4444">RoadRescue</text>
</svg>
